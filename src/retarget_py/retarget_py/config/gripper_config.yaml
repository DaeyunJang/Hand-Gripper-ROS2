gripper:
  scale: 0.24
  # scale_xyz: [0.12, 0.12, 0.12]
  target_suffix: world_abs
  fingers:
    - name: finger1
      base_offset_x: -0.12  # meter
      base_offset_y: -0.010 # meter
      target_finger: { label: left,  finger: index }
      finger_length: 0.1    # meter
    - name: finger2
      base_offset_x: -0.12
      base_offset_y:  0.010
      target_finger: { label: left,  finger: thumb }
      finger_length: 0.1    # meter
    - name: finger3
      base_offset_x:  0.02
      base_offset_y: -0.010
      target_finger: { label: right, finger: index }
      finger_length: 0.1    # meter
    - name: finger4
      base_offset_x:  0.02
      base_offset_y:  0.010
      target_finger: { label: right, finger: thumb }
      finger_length: 0.1    # meter
      