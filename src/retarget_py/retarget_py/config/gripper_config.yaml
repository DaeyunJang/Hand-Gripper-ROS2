gripper:
  scale: 0.48
  # scale_xyz: [0.12, 0.12, 0.12]
  target_suffix: canon_norm
  fingers:
    - name: finger1
      base_offset_x: -0.12
      base_offset_y: -0.010
      target_finger: { label: left,  finger: index }
    - name: finger2
      base_offset_x: -0.12
      base_offset_y:  0.010
      target_finger: { label: left,  finger: thumb }
    - name: finger3
      base_offset_x:  0.02
      base_offset_y: -0.010
      target_finger: { label: right, finger: index }
    - name: finger4
      base_offset_x:  0.02
      base_offset_y:  0.010
      target_finger: { label: right, finger: thumb }
